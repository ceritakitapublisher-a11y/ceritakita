<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root { --bg-color: #f8f9fa; --text-color: #212529; --card-bg: #ffffff; }
      body.dark-mode { --bg-color: #121212; --text-color: #f8f9fa; --card-bg: #1e1e1e; }
      body { background-color: var(--bg-color); color: var(--text-color); transition: 0.3s; padding: 20px; }
      .container { max-width: 600px; background: var(--card-bg); padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); color: var(--text-color); }
      .form-control, .form-select { background-color: var(--card-bg); color: var(--text-color); border-color: #ced4da; }
      body.dark-mode .form-control, body.dark-mode .form-select { border-color: #444; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="d-flex justify-content-between mb-3">
        <button id="themeToggle" class="btn btn-sm btn-outline-secondary">🌙 Dark/Light</button>
        <select id="langToggle" class="form-select form-select-sm w-auto">
          <option value="id">🇮🇩 ID</option>
          <option value="en">🇬🇧 EN</option>
        </select>
      </div>

      <h2 id="title">CERITA KITA PUBLISHER</h2>
      <form id="submissionForm">
        <div class="mb-3"><label class="form-label" id="labelNama">Nama Penulis</label><input type="text" class="form-control" id="nama" required></div>
        <div class="mb-3"><label class="form-label" id="labelEmail">Email</label><input type="email" class="form-control" id="email" required></div>
        <div class="mb-3"><label class="form-label" id="labelWa">No. WhatsApp</label><input type="tel" class="form-control" id="wa" required></div>
        <div class="mb-3"><label class="form-label" id="labelJudul">Judul Naskah</label><input type="text" class="form-control" id="judul" required></div>
        <div class="mb-3">
          <label class="form-label" id="labelKategori">Kategori Buku</label>
          <select class="form-select" id="kategori">
            <option value="Novel / Fiksi">Novel / Fiksi</option>
            <option value="Antologi Puisi / Cerpen">Antologi Puisi / Cerpen</option>
            <option value="Buku Anak">Buku Anak</option>
            <option value="Non-Fiksi / Self Improvement">Non-Fiksi / Self Improvement</option>
            <option value="Buku Ajar / Akademik">Buku Ajar / Akademik</option>
            <option value="Biografi">Biografi</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label" id="labelPaket">Paket Penerbitan</label>
          <select class="form-select" id="paket">
            <option value="Paket Reguler (Hanya Cetak & ISBN)">Paket Reguler (Hanya Cetak & ISBN)</option>
            <option value="Paket Premium (Cetak, ISBN, Layout & Cover)">Paket Premium (Cetak, ISBN, Layout & Cover)</option>
            <option value="Paket Eksklusif (All-in-One + Pemasaran)">Paket Eksklusif (All-in-One + Pemasaran)</option>
          </select>
        </div>
        <div class="mb-3"><label class="form-label">Unggah Naskah (PDF)</label><input type="file" class="form-control" id="file" accept="application/pdf" required></div>
        <button type="submit" class="btn btn-primary w-100" id="btnSubmit">Kirim Naskah</button>
      </form>
      
      <div id="status" class="mt-3 text-center"></div>
      <div id="waArea" class="mt-3 text-center" style="display:none;">
        <div class="alert alert-success">Data berhasil tersimpan!</div>
        <p class="text-muted">Klik tombol di bawah ini untuk mengirim detail ke WhatsApp Admin:</p>
        <a id="waLink" href="#" target="_blank" class="btn btn-success w-100 btn-lg">Kirim ke WhatsApp Admin</a>
      </div>
      
      <div class="text-center mt-4">
        <a href="https://ceritakitapublisher.taplink.site/" target="_blank" class="btn btn-link" id="linkTaplink">Kunjungi Link Kami</a>
      </div>
    </div>

    <script>
      const translations = {
        id: { title: "CERITA KITA PUBLISHER", nama: "Nama Penulis", email: "Email", wa: "No. WhatsApp", judul: "Judul Naskah", kategori: "Kategori Buku", paket: "Paket Penerbitan", btn: "Kirim Naskah", link: "Kunjungi Link Kami" },
        en: { title: "CERITA KITA PUBLISHER", nama: "Author Name", email: "Email", wa: "WhatsApp Number", judul: "Manuscript Title", kategori: "Book Category", paket: "Publishing Package", btn: "Submit Manuscript", link: "Visit Our Links" }
      };

      document.getElementById('themeToggle').onclick = () => {
        document.body.classList.toggle('dark-mode');
      };

      document.getElementById('langToggle').onchange = (e) => {
        const t = translations[e.target.value];
        document.getElementById('title').innerText = t.title;
        document.getElementById('labelNama').innerText = t.nama;
        document.getElementById('labelEmail').innerText = t.email;
        document.getElementById('labelWa').innerText = t.wa;
        document.getElementById('labelJudul').innerText = t.judul;
        document.getElementById('labelKategori').innerText = t.kategori;
        document.getElementById('labelPaket').innerText = t.paket;
        document.getElementById('btnSubmit').innerText = t.btn;
        document.getElementById('linkTaplink').innerText = t.link;
      };

      document.getElementById('submissionForm').onsubmit = (e) => {
        e.preventDefault();
        const fileInput = document.getElementById('file');
        if (!fileInput.files[0]) return alert("Pilih file PDF terlebih dahulu!");
        
        const file = fileInput.files[0];
        const reader = new FileReader();
        
        const nama = document.getElementById('nama').value;
        const email = document.getElementById('email').value;
        const wa = document.getElementById('wa').value;
        const judul = document.getElementById('judul').value;
        const kategori = document.getElementById('kategori').value;
        const paket = document.getElementById('paket').value;

        reader.onload = (f) => {
          const data = { nama, email, wa, judul, kategori, paket, file: f.target.result, fileName: file.name, mimeType: file.type };
          document.getElementById('status').innerText = 'Mengirim data ke sistem, mohon tunggu...';
          document.getElementById('btnSubmit').disabled = true;
          
          google.script.run.withSuccessHandler(() => {
            document.getElementById('status').innerHTML = '';
            
            const msg = `Halo Admin Cerita Kita Publisher, saya ingin mengajukan penerbitan naskah baru dengan rincian berikut:
            
Nama: ${nama}
Email: ${email}
No. WA: ${wa}
Judul: ${judul}
Kategori: ${kategori}
Paket: ${paket}

Mohon bantuannya untuk diproses. Terima kasih!`;
            
            const waUrl = `https://wa.me/6285878976277?text=${encodeURIComponent(msg)}`;
            document.getElementById('waLink').href = waUrl;
            document.getElementById('waArea').style.display = 'block';
            document.getElementById('submissionForm').style.display = 'none';
          }).processForm(data);
        };
        reader.readAsDataURL(file);
      };
    </script>
  </body>
</html>
